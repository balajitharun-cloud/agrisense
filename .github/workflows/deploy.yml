name: Deploy backend

# Builds the single-service image (backend + built frontend) and publishes it
# to GitHub Container Registry. Any host that runs containers can then pull
# ghcr.io/<owner>/agrisense:latest.
#
# Optional: set a repository secret named RENDER_DEPLOY_HOOK to the deploy-hook
# URL from a Render "Web Service -> Deploy Hook". If present, this workflow
# pings it after a successful image push so Render redeploys automatically.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-host-redeploy:
    name: Trigger host redeploy (optional)
    needs: build-and-push
    runs-on: ubuntu-latest
    # NOTE: the `secrets` context is NOT allowed in a job-level `if:` — GitHub
    # rejects the whole workflow if you use it. Pass the secret via `env` on the
    # step and test it in the shell instead.
    if: github.event_name == 'push'
    steps:
      - name: Ping Render deploy hook (skipped when not configured)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set - skipping host redeploy."
            exit 0
          fi
          echo "Triggering Render redeploy…"
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
          echo "Done."
