name: Deploy to GitHub Pages

# Builds the frontend in STATIC mode (no backend) and publishes it to Pages.
# The Express API cannot run on Pages, so lib/staticApi.js serves every call
# in the browser from the backend's own data + pure service modules.
#
# Pages site: https://balajitharun-cloud.github.io/agrisense/

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/src/data/**'
      - 'backend/src/services/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build (static API mode, Pages base path)
        working-directory: frontend
        env:
          VITE_STATIC_API: 'true'
          VITE_BASE: '/agrisense/'
        run: npm run build

      - name: Add SPA fallback for deep links
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
